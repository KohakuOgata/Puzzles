<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライツアウト — Puzzles</title>
<meta name="description" content="すべてのライトを消すパズル。盤面はランダム生成で、必ず解けます。">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💡</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <h1 class="site-title">ライツアウト</h1>
    <a class="back-link" href="../../">← パズル一覧</a>
  </header>

  <p class="lede">すべてのライトを消せばクリア。押したマスと上下左右が同時に反転します。</p>

  <div class="controls">
    <div class="seg" id="size-seg" role="group" aria-label="盤面サイズ"></div>
    <button class="btn primary" id="new-game" type="button">新しい問題</button>
    <button class="btn" id="restart" type="button">やり直す</button>
    <button class="btn" id="hint" type="button">ヒント</button>
  </div>

  <div class="stats">
    <div>
      <span class="stat-label">手数</span>
      <span class="stat-value" id="moves">0</span>
    </div>
    <div>
      <span class="stat-label">時間</span>
      <span class="stat-value" id="time">00:00</span>
    </div>
    <div>
      <span class="stat-label">最少記録</span>
      <span class="stat-value" id="best">—</span>
    </div>
  </div>

  <p class="message" id="message" role="status" aria-live="polite"></p>

  <div class="board" id="board" role="grid" aria-label="ライツアウトの盤面"></div>

  <section class="rules">
    <h2>遊び方</h2>
    <ul>
      <li>マスをクリック（タップ）すると、そのマスと上下左右の 4 マスが点灯／消灯します。</li>
      <li>盤面のライトをすべて消すとクリアです。</li>
      <li>問題は「全消灯の盤面をランダムに押した状態」から作るので、必ず解けます。</li>
      <li>「ヒント」は残りの最短手数と、押すとよいマスを 1 つ教えます。</li>
      <li>最少記録は盤面サイズごとにブラウザ内へ保存されます。</li>
    </ul>
  </section>

  <footer class="site-footer">
    <a href="../../">← パズル一覧に戻る</a>
  </footer>
</div>

<script src="game.js"></script>
</body>
</html>
